services:
  postgres:
    image: "postgres@sha256:{{POSTGRES_IMAGE_DIGEST}}"
    environment:
      POSTGRES_DB: autoresearch
      POSTGRES_USER: autoresearch
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${AUTORESEARCH_POSTGRES_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql/data
secrets:
  postgres_password:
    file: ./.secrets/postgres_password.txt
