version: 1
authority:
  coordinator: schedules leases and budgets; cannot edit candidates, evaluate, or select winners
  workers: may edit only Candidate/Candidate.cs in isolated worktrees
  evaluation_authority: exclusively runs canonical evaluation, accesses holdouts, and retains the best
  readiness_judges: advisory, blinded, no tools, and unable to change the research decision
  independent_verifier: reproduces the retained winner in a fresh worktree
protected_paths:
  - Contract/**
  - Evaluator/**
  - Gate/**
  - ControlPlane/**
  - Swarm/**
  - ReadinessJudge/**
  - Environment/**
  - Tests/**
  - Candidate/Candidate.csproj
  - program.md
  - governance.yaml
  - lab.manifest.json
mutable_paths:
  - Candidate/Candidate.cs
readiness_mode: advisory
automatic_merging: false
production_integration: false
artifact_boundary: canonical evaluation, manifest, changed-path, and authority-context inputs must be produced and stored where workers have no write access
